name: Python package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ${{ matrix.runner || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '2.7'
            image: python:2.7.18-buster
          - python: '3.5'
            image: python:3.5.10-buster
          - python: '3.6'
            image: python:3.6.15-bullseye
          - python: '3.7'
            runner: ubuntu-22.04
          - python: '3.8'
          - python: '3.9'
          - python: '3.10'
          - python: '3.11'
          - python: '3.12'
          - python: '3.13'
          - python: '3.14'
          - python: '3.15'
            prerelease: true

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        if: ${{ !matrix.image }}
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: ${{ matrix.prerelease || false }}

      - name: Install package and test on host
        if: ${{ !matrix.image }}
        run: |
          python -m pip install '.[testing]'
          python -m coverage run --source=pyramid_csrf_multi_scheme -m pytest tests
          python -m coverage html

      - name: Install package and test in legacy Python container
        if: ${{ matrix.image }}
        env:
          PYTHON_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --env HOME=/tmp --volume "$PWD:/workspace" --workdir /workspace \
            "$PYTHON_IMAGE" sh -ec '
              export PYTHONUSERBASE="$(mktemp -d)"
              python -m pip install --user --no-cache-dir --upgrade pip
              python -m pip install --user --no-cache-dir ".[testing]"
              python -m coverage run --source=pyramid_csrf_multi_scheme -m pytest tests
              python -m coverage html
            '

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-python-${{ matrix.python }}
          path: htmlcov/
